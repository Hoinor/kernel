name: Build XanMod Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libncurses-dev \
          bison \
          flex \
          libssl-dev \
          libelf-dev \
          bc \
          kmod \
          cpio \
          rsync \
          wget \
          tar \
          xz-utils
          
    - name: Configure kernel
      run: |
        # 完全清理构建环境
        make mrproper
        make clean

        # 为scripts目录下的所有脚本添加执行权限
        find scripts/ -type f -exec chmod +x {} \; 2>/dev/null || true

        # 使用GitHub Actions优化配置
        cp .config.github .config

        # 生成完整的配置文件
        make ARCH=x86_64 olddefconfig

        # 准备构建环境（按正确顺序）
        make ARCH=x86_64 scripts_basic
        make ARCH=x86_64 prepare0
        make ARCH=x86_64 prepare
        make ARCH=x86_64 scripts
        
    - name: Build kernel
      run: |
        # 编译内核，使用所有可用CPU核心
        # 注意：CONFIG_MODULES=n，所以不需要单独编译模块
        make -j$(nproc) ARCH=x86_64 LOCALVERSION=-xanmod-custom bzImage
        
    - name: Create kernel package
      run: |
        # 创建安装目录
        mkdir -p kernel-package/boot

        # 获取内核版本
        KERNEL_VERSION=$(make -s kernelrelease)
        echo "Kernel version: $KERNEL_VERSION"

        # 复制内核文件
        cp arch/x86/boot/bzImage kernel-package/boot/vmlinuz-${KERNEL_VERSION}
        cp System.map kernel-package/boot/System.map-${KERNEL_VERSION}
        cp .config kernel-package/boot/config-${KERNEL_VERSION}

        # 注意：CONFIG_MODULES=n，所以没有模块需要安装

        # 复制安装脚本（如果存在）
        if [ -f install-kernel.sh ]; then
          cp install-kernel.sh kernel-package/
          chmod +x kernel-package/install-kernel.sh
        fi
        
        # 创建安装说明
        cat > kernel-package/INSTALL.md << 'EOF'
        # XanMod内核安装说明
        
        ## 自动安装（推荐）
        ```bash
        sudo ./install-kernel.sh
        ```
        
        ## 手动安装
        ```bash
        # 复制内核文件
        sudo cp boot/* /boot/
        sudo cp -r lib/modules/* /lib/modules/
        
        # 更新引导加载程序
        sudo update-grub
        
        # 重启系统
        sudo reboot
        ```
        
        ## 验证安装
        重启后运行以下命令验证修改：
        ```bash
        # 查看硬盘容量（放大3倍）
        df -h
        
        # 查看内存信息（放大2倍）
        cat /proc/meminfo
        
        # 查看CPU信息（放大2倍）
        cat /proc/cpuinfo
        ```
        EOF
        
        # 创建压缩包
        tar -czf kernel-$(make kernelrelease).tar.gz -C kernel-package .
        
    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build-${{ github.sha }}
        path: |
          kernel-*.tar.gz
          arch/x86/boot/bzImage
          System.map
          .config
          install-kernel.sh
        retention-days: 30
        
    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          kernel-*.tar.gz
          arch/x86/boot/bzImage
        body: |
          ## XanMod内核构建
          
          此版本包含以下修改：
          - 硬盘容量显示放大3倍
          - 内存信息显示放大2倍  
          - CPU信息显示放大2倍
          
          ### 安装说明
          1. 下载 `kernel-*.tar.gz` 文件
          2. 解压到根目录: `sudo tar -xzf kernel-*.tar.gz -C /`
          3. 更新引导加载程序: `sudo update-grub`
          4. 重启系统选择新内核
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}